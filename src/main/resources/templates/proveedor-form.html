<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page}, 'proveedores')}">
<head>
    <title>Proveedor · Pluma y Papel</title>
</head>
<body>
<div id="page">
    <div style="display:flex; justify-content:center; align-items:center; min-height:70vh;">
        <div class="modal-card" style="border:1px solid var(--border-table);">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" th:text="${form.id == null} ? 'Nuevo proveedor' : 'Editar proveedor'">Proveedor</h2>
                    <p class="modal-subtitle">El RUC debe tener 11 dígitos y no repetirse.</p>
                </div>
                <a th:href="@{/proveedores}" class="modal-close" style="text-decoration:none;" aria-label="Cerrar">✕</a>
            </div>
            <form th:action="@{/proveedores}" th:object="${form}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="app-alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                </div>
                <div class="modal-grid">
                    <div class="form-group" th:classappend="${#fields.hasErrors('ruc')} ? 'has-error'">
                        <label for="ruc">RUC *</label>
                        <input id="ruc" th:field="*{ruc}" maxlength="11" inputmode="numeric" placeholder="20123456789">
                        <div class="field-error" th:errors="*{ruc}"></div>
                    </div>
                    <div class="form-group" th:classappend="${#fields.hasErrors('telefono')} ? 'has-error'">
                        <label for="telefono">Teléfono</label>
                        <input id="telefono" th:field="*{telefono}" maxlength="20" placeholder="012345678">
                        <div class="field-error" th:errors="*{telefono}"></div>
                    </div>
                </div>
                <div class="form-group" style="margin-top:14px;" th:classappend="${#fields.hasErrors('razonSocial')} ? 'has-error'">
                    <label for="razonSocial">Razón social *</label>
                    <input id="razonSocial" th:field="*{razonSocial}" maxlength="150" placeholder="Distribuidora S.A.C.">
                    <div class="field-error" th:errors="*{razonSocial}"></div>
                </div>
                <div class="form-group" style="margin-top:14px;" th:classappend="${#fields.hasErrors('correo')} ? 'has-error'">
                    <label for="correo">Correo</label>
                    <input id="correo" th:field="*{correo}" maxlength="120" placeholder="ventas@proveedor.pe">
                    <div class="field-error" th:errors="*{correo}"></div>
                </div>
                <div class="form-group" style="margin-top:14px;" th:classappend="${#fields.hasErrors('direccion')} ? 'has-error'">
                    <label for="direccion">Dirección</label>
                    <input id="direccion" th:field="*{direccion}" maxlength="200">
                    <div class="field-error" th:errors="*{direccion}"></div>
                </div>
                <div class="modal-footer">
                    <a class="btn-modal-cancel" style="text-decoration:none; display:inline-flex; align-items:center;" th:href="@{/proveedores}">Cancelar</a>
                    <button class="btn-modal-submit" type="submit">Guardar proveedor</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
