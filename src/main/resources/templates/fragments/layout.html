<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido, activo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Pluma y Papel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="brand-container">
        <div class="brand-icon">P</div>
        <div class="brand-info">
            <span class="brand-title">Pluma y Papel</span>
            <span class="brand-sub">Sistema de Gestión de Librería</span>
        </div>
    </div>
    <div class="user-container">
        <span class="user-text" th:text="${usuarioActual + ' · Rol: ' + rolEtiqueta}">admin · Rol: Administrador</span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </div>
</header>

<div class="shell">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a th:href="@{/}" class="nav-item" th:classappend="${activo == 'panel'} ? 'active'">
                <span class="nav-badge">PA</span>
                <span class="nav-text">Panel</span>
            </a>
            <a th:href="@{/productos}" class="nav-item" th:classappend="${activo == 'productos'} ? 'active'">
                <span class="nav-badge">PR</span>
                <span class="nav-text">Productos</span>
            </a>
            <a href="javascript:void(0)" onclick="avisoModulo('Categorías')" class="nav-item" th:classappend="${activo == 'categorias'} ? 'active' : 'nav-disabled'">
                <span class="nav-badge">CA</span>
                <span class="nav-text">Categorías</span>
            </a>
            <a href="javascript:void(0)" onclick="avisoModulo('Inventario')" class="nav-item" th:classappend="${activo == 'inventario'} ? 'active' : 'nav-disabled'">
                <span class="nav-badge">IN</span>
                <span class="nav-text">Inventario</span>
            </a>
            <a href="javascript:void(0)" onclick="avisoModulo('Proveedores')" class="nav-item" th:classappend="${activo == 'proveedores'} ? 'active' : 'nav-disabled'">
                <span class="nav-badge">PR</span>
                <span class="nav-text">Proveedores</span>
            </a>
            <a href="javascript:void(0)" onclick="avisoModulo('Compras')" class="nav-item" th:classappend="${activo == 'compras'} ? 'active' : 'nav-disabled'">
                <span class="nav-badge">CO</span>
                <span class="nav-text">Compras</span>
            </a>
            <a th:href="${puedeVender} ? @{/clientes} : 'javascript:void(0)'"
               th:onclick="${!puedeVender} ? 'avisoModulo(\'Clientes (requiere rol Vendedor o Administrador)\')' : null"
               class="nav-item" th:classappend="${activo == 'clientes'} ? 'active' : (${!puedeVender} ? 'nav-disabled' : '')">
                <span class="nav-badge">CL</span>
                <span class="nav-text">Clientes</span>
            </a>
            <a th:href="${puedeVender} ? @{/ventas/nueva} : 'javascript:void(0)'"
               th:onclick="${!puedeVender} ? 'avisoModulo(\'Nueva venta (requiere rol Vendedor o Administrador)\')' : null"
               class="nav-item" th:classappend="${activo == 'venta'} ? 'active' : (${!puedeVender} ? 'nav-disabled' : '')">
                <span class="nav-badge">NV</span>
                <span class="nav-text">Nueva venta</span>
            </a>
            <a th:href="${puedeVender} ? @{/ventas} : 'javascript:void(0)'"
               th:onclick="${!puedeVender} ? 'avisoModulo(\'Historial (requiere rol Vendedor o Administrador)\')' : null"
               class="nav-item" th:classappend="${activo == 'historial'} ? 'active' : (${!puedeVender} ? 'nav-disabled' : '')">
                <span class="nav-badge">HI</span>
                <span class="nav-text">Historial</span>
            </a>
            <a href="javascript:void(0)" onclick="avisoModulo('Reportes')" class="nav-item" th:classappend="${activo == 'reportes'} ? 'active' : 'nav-disabled'">
                <span class="nav-badge">RE</span>
                <span class="nav-text">Reportes</span>
            </a>
            <a href="javascript:void(0)" onclick="avisoModulo('Usuarios')" class="nav-item" th:classappend="${activo == 'usuarios'} ? 'active' : 'nav-disabled'">
                <span class="nav-badge">US</span>
                <span class="nav-text">Usuarios</span>
            </a>
        </nav>
    </aside>

    <main class="content-area">
        <div th:if="${ok}" class="app-alert alert-ok" th:text="${ok}"></div>
        <div th:if="${error}" class="app-alert alert-error" th:text="${error}"></div>
        <th:block th:replace="${contenido}"></th:block>
        <footer class="prototype-footer">
            Prototipo de alta fidelidad - Los módulos y acciones dependen del rol autenticado
        </footer>
    </main>
</div>

<div id="toastModulo" class="proto-toast" style="display: none;"></div>
<script>
function avisoModulo(nombre) {
    const t = document.getElementById('toastModulo');
    if (!t) return;
    t.textContent = 'Módulo ' + nombre + ': No disponible en este prototipo.';
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2600);
}
</script>
</body>
</html>
