spring.application.name=libreria

# Parámetros de conexión a la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_db
spring.datasource.username=root
spring.datasource.password=UTP2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad de sesión: expira a los 30 min de inactividad
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logs
logging.level.com.utp.libreria=INFO
