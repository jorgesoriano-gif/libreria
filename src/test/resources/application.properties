spring.application.name=libreria_completo

# ==========================================
# PARÁMETROS DE CONEXIÓN A LA BASE DE DATOS
# ==========================================
# Se corrigió el puerto a 3306 (estándar de MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_completo
spring.datasource.username=libreria_app
spring.datasource.password=UTP2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

