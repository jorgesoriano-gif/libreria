spring.application.name=libreria

# Conexión a MySQL: credenciales por variables de entorno (nunca en el código).
# Ejemplo (PowerShell):  $env:DB_USER="libreria_app"; $env:DB_PASSWORD="<clave>"
spring.datasource.url=jdbc:mysql://localhost:3306/libreria_db
spring.datasource.username=${DB_USER:libreria_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad de sesión (RNF02): expira a los 30 min de inactividad, cookie no accesible desde JS
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Logs: nivel y archivo rotativo configurados en logback-spring.xml
logging.level.com.utp.libreria=INFO
