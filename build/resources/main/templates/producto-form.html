<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page}, 'productos')}">
<head>
    <title>Producto · Pluma y Papel</title>
</head>
<body>
<div id="page">
    <div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="modal-card" style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid var(--border-table);">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" th:text="${form.id == null} ? 'Nuevo producto' : 'Editar producto'">Editar producto</h2>
                    <p class="modal-subtitle" th:if="${form.id != null}">Actualiza los datos del producto <span th:text="${form.codigo}">L-0087</span>.</p>
                    <p class="modal-subtitle" th:if="${form.id == null}">Ingresa los datos para registrar un nuevo producto en el catálogo.</p>
                </div>
                <a th:href="@{/productos}" class="modal-close" style="text-decoration:none;" aria-label="Cerrar">✕</a>
            </div>

            <form th:action="@{/productos}" th:object="${form}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{stock}">
                <input type="hidden" th:field="*{activo}">

                <div class="modal-grid">
                    <div class="form-group" th:classappend="${#fields.hasErrors('codigo')} ? 'has-error'">
                        <label for="codigo">Código *</label>
                        <input id="codigo" th:field="*{codigo}" maxlength="20" placeholder="Ej. L-0087">
                        <span class="field-hint" th:if="${!#fields.hasErrors('codigo')}">El código debe ser único.</span>
                        <div class="field-error" th:errors="*{codigo}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('titulo')} ? 'has-error'">
                        <label for="titulo">Título *</label>
                        <input id="titulo" th:field="*{titulo}" maxlength="120" placeholder="Ej. El Principito">
                        <div class="field-error" th:errors="*{titulo}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('autor')} ? 'has-error'">
                        <label for="autor">Autor</label>
                        <input id="autor" th:field="*{autor}" maxlength="80" placeholder="Ej. Antoine de Saint-Exupéry">
                        <div class="field-error" th:errors="*{autor}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('categoriaId')} ? 'has-error'">
                        <label for="categoriaId">Categoría *</label>
                        <select id="categoriaId" th:field="*{categoriaId}">
                            <option value="">Libros</option>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                        </select>
                        <div class="field-error" th:errors="*{categoriaId}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('precio')} ? 'has-error'">
                        <label for="precio">Precio de venta (S/) *</label>
                        <input id="precio" th:field="*{precio}" type="text" inputmode="decimal" placeholder="35.00">
                        <span class="field-hint" th:if="${!#fields.hasErrors('precio')}">Debe ser mayor que cero.</span>
                        <div class="field-error" th:errors="*{precio}"></div>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('stockMinimo')} ? 'has-error'">
                        <label for="stockMinimo">Stock mínimo *</label>
                        <input id="stockMinimo" th:field="*{stockMinimo}" type="number" min="0" placeholder="3">
                        <div class="field-error" th:errors="*{stockMinimo}"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <a class="btn-modal-cancel" style="text-decoration:none; display:inline-flex; align-items:center;" th:href="@{/productos}">Cancelar</a>
                    <button class="btn-modal-submit" type="submit">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
