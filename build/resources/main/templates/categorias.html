<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page}, 'categorias')}">
<head>
    <title>Categorías · Pluma y Papel</title>
</head>
<body>
<div id="page">
    <div class="page-header">
        <h1 class="page-title">Categorías</h1>
        <p class="page-subtitle">Clasificación del catálogo. Una categoría con productos asociados no puede eliminarse.</p>
    </div>

    <div class="filters-bar">
        <div class="filter-actions" style="margin-left:auto;">
            <a class="btn btn-nuevo" th:href="@{/categorias/nueva}">+ Nueva categoría</a>
        </div>
    </div>

    <div class="table-card">
        <table class="data-table">
            <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th class="num">Productos</th>
                <th style="text-align:right;">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.codigo}"></td>
                <td th:text="${c.nombre}" style="font-weight:500;"></td>
                <td th:text="${c.descripcion != null ? c.descripcion : '—'}"></td>
                <td class="num" th:text="${conteo[c.id]}"></td>
                <td style="text-align:right;">
                    <div class="table-row-actions" style="justify-content:flex-end;">
                        <a class="btn-action-edit" th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                        <form th:action="@{/categorias/{id}/eliminar(id=${c.id})}" method="post" style="margin:0; display:inline;"
                              onsubmit="return confirm('¿Eliminar la categoría?');">
                            <button type="submit" class="btn-action-delete">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="5" style="text-align:center; padding:20px; color:var(--text-muted);">No hay categorías registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="table-records-count">Mostrando <span th:text="${#lists.size(categorias)}">0</span> registros...</div>
</div>
</body>
</html>
