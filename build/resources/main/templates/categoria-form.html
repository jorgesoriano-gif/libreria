<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page}, 'categorias')}">
<head>
    <title>Categoría · Pluma y Papel</title>
</head>
<body>
<div id="page">
    <div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
        <div class="modal-card" style="border:1px solid var(--border-table);">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title" th:text="${form.id == null} ? 'Nueva categoría' : 'Editar categoría'">Categoría</h2>
                    <p class="modal-subtitle">El código CAT-NNN se asigna automáticamente.</p>
                </div>
                <a th:href="@{/categorias}" class="modal-close" style="text-decoration:none;" aria-label="Cerrar">✕</a>
            </div>
            <form th:action="@{/categorias}" th:object="${form}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="app-alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                </div>
                <div class="form-group" th:classappend="${#fields.hasErrors('nombre')} ? 'has-error'">
                    <label for="nombre">Nombre *</label>
                    <input id="nombre" th:field="*{nombre}" maxlength="50" placeholder="Ej. Novela">
                    <div class="field-error" th:errors="*{nombre}"></div>
                </div>
                <div class="form-group" style="margin-top:14px;" th:classappend="${#fields.hasErrors('descripcion')} ? 'has-error'">
                    <label for="descripcion">Descripción</label>
                    <input id="descripcion" th:field="*{descripcion}" maxlength="150" placeholder="Opcional">
                    <div class="field-error" th:errors="*{descripcion}"></div>
                </div>
                <div class="modal-footer">
                    <a class="btn-modal-cancel" style="text-decoration:none; display:inline-flex; align-items:center;" th:href="@{/categorias}">Cancelar</a>
                    <button class="btn-modal-submit" type="submit">Guardar categoría</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
