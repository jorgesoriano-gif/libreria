<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page}, 'compras')}">
<head>
    <title>Detalle de orden · Pluma y Papel</title>
</head>
<body>
<div id="page">
    <div class="page-header">
        <h1 class="page-title" th:text="${'Orden ' + orden.numero}">Orden</h1>
        <p class="page-subtitle">Detalle de la orden y recepción de mercadería.</p>
    </div>

    <div class="card" style="margin-bottom:20px;">
        <div class="grid cols-2">
            <div><strong>Proveedor:</strong> <span th:text="${orden.proveedor.razonSocial}"></span></div>
            <div><strong>RUC:</strong> <span th:text="${orden.proveedor.ruc}"></span></div>
            <div><strong>Emisión:</strong> <span th:text="${#temporals.format(orden.fechaEmision, 'dd/MM/yyyy HH:mm')}"></span></div>
            <div><strong>Entrega estimada:</strong>
                <span th:text="${orden.fechaEntregaEstimada != null ? #temporals.format(orden.fechaEntregaEstimada, 'dd/MM/yyyy') : '—'}"></span></div>
            <div><strong>Registrada por:</strong> <span th:text="${orden.usuario.nombre}"></span></div>
            <div><strong>Estado:</strong>
                <span class="badge-tag" th:classappend="${orden.pendiente} ? 'warn' : 'good'" th:text="${orden.pendiente ? 'Pendiente' : 'Recibida'}"></span></div>
            <div th:if="${orden.fechaRecepcion != null}"><strong>Recepción:</strong>
                <span th:text="${#temporals.format(orden.fechaRecepcion, 'dd/MM/yyyy HH:mm')}"></span></div>
        </div>
    </div>

    <div class="table-card">
        <table class="data-table">
            <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th class="num">Pedido</th>
                <th class="num">Recibido</th>
                <th class="num">Costo unit.</th>
                <th class="num">Subtotal</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${detalles}">
                <td th:text="${d.producto.codigo}"></td>
                <td th:text="${d.producto.titulo}"></td>
                <td class="num" th:text="${d.cantidad}"></td>
                <td class="num" th:text="${d.cantidadRecibida}"></td>
                <td class="num" th:text="${'S/ ' + #numbers.formatDecimal(d.costoUnitario, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="num" th:text="${'S/ ' + #numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <div style="font-size:1.1rem;">Total:
            <strong style="color:var(--navy);" th:text="${'S/ ' + #numbers.formatDecimal(orden.total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</strong>
        </div>
        <div style="display:flex; gap:8px;">
            <a class="btn btn-outline" th:href="@{/compras}">Volver</a>
            <form th:if="${orden.pendiente}" th:action="@{/compras/{id}/recepcionar(id=${orden.id})}" method="post" style="margin:0;"
                  onsubmit="return confirm('¿Confirmar la recepción? Se sumará el stock de todas las líneas.');">
                <button type="submit" class="btn btn-nuevo">Recepcionar mercadería</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
