<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Pluma y Papel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<div class="login-wrapper">
    <form class="login-card" th:action="@{/login}" method="post">
        <div class="login-header">
            <div class="login-brand-icon">P</div>
            <h1>Pluma y Papel</h1>
            <p class="login-subtitle">Sistema de Gestión de Librería</p>
        </div>

        <div class="app-alert alert-error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
        <div class="app-alert alert-error" th:if="${param.inactivo}">La cuenta está inactiva. Consulte con el administrador.</div>
        <div class="app-alert alert-ok" th:if="${param.logout}">Sesión cerrada correctamente.</div>

        <div class="form-group" style="margin-bottom: 14px;">
            <label for="username">Usuario *</label>
            <input id="username" name="username" type="text" required autofocus autocomplete="username" placeholder="admin">
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label for="password">Contraseña *</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" type="submit" style="width: 100%;">Ingresar</button>
    </form>
</div>
</body>
</html>
