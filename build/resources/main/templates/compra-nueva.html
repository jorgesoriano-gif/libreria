<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#page}, 'compras')}">
<head>
    <title>Nueva orden de compra · Pluma y Papel</title>
</head>
<body>
<div id="page">
    <div class="page-header">
        <h1 class="page-title">Nueva orden de compra</h1>
        <p class="page-subtitle">Elija el proveedor, agregue productos y confirme. La orden queda PENDIENTE hasta su recepción.</p>
    </div>

    <div class="card" style="margin-bottom:20px;">
        <form th:action="@{/compras/agregar}" method="post" class="filters-bar" style="box-shadow:none; padding:0;">
            <div class="filter-field flex-grow">
                <label for="proveedorId">Proveedor</label>
                <select id="proveedorId" name="proveedorId" required>
                    <option value="">Seleccione un proveedor</option>
                    <option th:each="p : ${proveedores}" th:value="${p.id}"
                            th:text="${p.razonSocial + ' (' + p.ruc + ')'}"
                            th:selected="${proveedorSel != null and p.id == proveedorSel}"></option>
                </select>
            </div>
            <div class="filter-field">
                <label for="entrega">Entrega estimada</label>
                <input type="date" id="entrega" name="entrega" th:value="${entregaSel}" th:min="${hoy}">
            </div>
            <div class="filter-field flex-grow">
                <label for="productoId">Producto</label>
                <select id="productoId" name="productoId" required>
                    <option value="">Seleccione un producto</option>
                    <option th:each="p : ${catalogo}" th:value="${p.id}" th:text="${p.codigo + ' - ' + p.titulo}"></option>
                </select>
            </div>
            <div class="filter-field" style="max-width:100px;">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
            </div>
            <div class="filter-field" style="max-width:130px;">
                <label for="costo">Costo unit. (S/)</label>
                <input type="number" id="costo" name="costo" min="0" step="0.01" required>
            </div>
            <div class="filter-actions">
                <button class="btn btn-search" type="submit">Agregar</button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <table class="data-table">
            <thead>
            <tr>
                <th>Código</th>
                <th>Producto</th>
                <th class="num">Cantidad</th>
                <th class="num">Costo unit.</th>
                <th class="num">Subtotal</th>
                <th style="text-align:right;">Quitar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${items}">
                <td th:text="${i.codigo}"></td>
                <td th:text="${i.titulo}"></td>
                <td class="num" th:text="${i.cantidad}"></td>
                <td class="num" th:text="${'S/ ' + #numbers.formatDecimal(i.costo, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="num" th:text="${'S/ ' + #numbers.formatDecimal(i.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
                <td style="text-align:right;">
                    <form th:action="@{/compras/quitar/{id}(id=${i.productoId})}" method="post" style="margin:0;">
                        <button type="submit" class="btn-action-delete">Quitar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="6" style="text-align:center; padding:20px; color:var(--text-muted);">Aún no hay productos en la orden.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
        <div style="font-size:1.1rem;">Total:
            <strong style="color:var(--navy);" th:text="${'S/ ' + #numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</strong>
        </div>
        <div style="display:flex; gap:8px;">
            <a class="btn btn-outline" th:href="@{/compras}">Volver</a>
            <form th:action="@{/compras/vaciar}" method="post" style="margin:0;">
                <button type="submit" class="btn btn-outline">Vaciar</button>
            </form>
            <form th:action="@{/compras/confirmar}" method="post" style="margin:0;">
                <button type="submit" class="btn btn-nuevo" th:disabled="${#lists.isEmpty(items)}">Confirmar orden</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
